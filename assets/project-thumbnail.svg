<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="pbiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Abstract Tech Grid & Circles -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="1000" cy="150" r="280" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="200" cy="500" r="220" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Top Badge: VinAI Build Phase 2026 -->
  <g transform="translate(80, 65)">
    <rect width="210" height="34" rx="17" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe" letter-spacing="1">VINAI BUILD PHASE 2026</text>
  </g>

  <!-- Project Name Main Header -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">AUTO ANNOTATION REPORTER</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Hệ Thống Tự Động Hóa Quản Trị &amp; Báo Cáo Tiến Độ Gán Nhãn Dữ Liệu AI</text>
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#38bdf8">CVAT &amp; GitHub Sync &bull; Medallion Lakehouse &bull; Power BI 5-Page Dashboard &bull; AI Summarizer</text>
  </g>

  <!-- Center Feature Cards -->
  <g transform="translate(80, 290)">
    
    <!-- Card 1: Ingestion & Deep Link -->
    <g transform="translate(0, 0)">
      <rect width="320" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="36" cy="38" r="18" fill="#0284c7" fill-opacity="0.2" />
      <text x="28" y="44" font-size="18">🔗</text>
      <text x="66" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">CVAT &amp; GitHub Sync</text>
      <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" line-height="1.5">
        <tspan x="24" dy="0">&bull; Deep Link Frame-Level (?frame={idx})</tspan>
        <tspan x="24" dy="22">&bull; Bóc tách tự động Issues &amp; Blocker</tspan>
        <tspan x="24" dy="22">&bull; Retry Backoff &amp; Chống SSRF</tspan>
      </text>
    </g>

    <!-- Card 2: Medallion Lakehouse -->
    <g transform="translate(355, 0)">
      <rect width="320" height="175" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="36" cy="38" r="18" fill="#10b981" fill-opacity="0.2" />
      <text x="28" y="44" font-size="18">🏛️</text>
      <text x="66" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Medallion Lakehouse</text>
      <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
        <tspan x="24" dy="0">&bull; 3 Tầng: Bronze &rarr; Silver &rarr; Gold</tspan>
        <tspan x="24" dy="22">&bull; Kimball Star Schema 12 bảng</tspan>
        <tspan x="24" dy="22">&bull; 100% Append-only Audit Trail</tspan>
      </text>
    </g>

    <!-- Card 3: Power BI Direct & AI -->
    <g transform="translate(710, 0)">
      <rect width="330" height="175" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="36" cy="38" r="18" fill="#f59e0b" fill-opacity="0.2" />
      <text x="28" y="44" font-size="18">📊</text>
      <text x="66" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Power BI &amp; Gemini AI</text>
      <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
        <tspan x="24" dy="0">&bull; 5 Trang Dashboard Chuẩn Doanh Nghiệp</tspan>
        <tspan x="24" dy="22">&bull; 20 DAX Measures đối soát kép 0.0000%</tspan>
        <tspan x="24" dy="22">&bull; 1-Click Multi-Machine Launcher</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Stats Ribbon -->
  <g transform="translate(80, 510)">
    <rect width="1040" height="65" rx="12" fill="#111827" fill-opacity="0.95" stroke="#1f2937" stroke-width="1.5" />
    
    <g transform="translate(40, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#38bdf8">12.000x</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Tốc Độ Báo Cáo</text>
    </g>
    
    <line x1="220" y1="12" x2="220" y2="52" stroke="#334155" stroke-width="1" />

    <g transform="translate(260, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#10b981">136 / 136</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Unit Tests PASS (100%)</text>
    </g>

    <line x1="490" y1="12" x2="490" y2="52" stroke="#334155" stroke-width="1" />

    <g transform="translate(530, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#f59e0b">20 / 20</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">DAX Measures Khớp 100%</text>
    </g>

    <line x1="750" y1="12" x2="750" y2="52" stroke="#334155" stroke-width="1" />

    <g transform="translate(790, 22)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#a855f7">Zero-Ops</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-transform="uppercase">Chi Phí Hạ Tầng</text>
    </g>
  </g>
</svg>
