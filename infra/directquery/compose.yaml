name: annotation-reporter-auto
services:
  reporting-db:
    image: postgres:17-alpine
    container_name: annotation-reporter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: annotation_reporting
      POSTGRES_USER: annotation_owner
      POSTGRES_PASSWORD: ${ANNOTATION_PG_OWNER_PASSWORD:?Run src.auto_desktop --setup first}
    ports:
      - "127.0.0.1:${ANNOTATION_PG_PORT:-55432}:5432"
    volumes:
      - reporting-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annotation_owner -d annotation_reporting"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  reporting-data:
