name: Annotation report and Power BI data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source mode
        required: true
        type: choice
        options: [offline, live]
        default: offline
      task_id:
        description: CVAT task ID (live only)
        required: false
        type: string
  schedule:
    - cron: '0 10 * * 4'
    - cron: '0 11 * * 0'
  push:
    paths: ['src/**', 'tests/**', 'powerbi/*.py', 'requirements*.txt', '.github/workflows/annotation-report.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'powerbi/*.py', 'requirements*.txt', '.github/workflows/annotation-report.yml']

permissions:
  contents: read

concurrency:
  group: annotation-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-runtime.txt
      - name: Unit and publication tests
        run: python -m unittest discover -s tests -v
      - name: Create demo fixture
        run: python powerbi/create_demo_snapshot.py
      - name: Build report and serving bundle
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_MODE: ${{ vars.ANNOTATION_REPORT_MODE }}
          REQUESTED_TASK: ${{ inputs.task_id }}
          CVAT_TASK_ID: ${{ vars.CVAT_TASK_ID }}
          CVAT_HOST: ${{ vars.CVAT_HOST }}
          CVAT_TOKEN: ${{ secrets.CVAT_TOKEN }}
          CVAT_ORG: ${{ vars.CVAT_ORG }}
          GITHUB_REPO: ${{ vars.ANNOTATION_TRACKER_REPO }}
          GITHUB_TOKEN: ${{ secrets.ANNOTATION_TRACKER_TOKEN }}
        shell: bash
        run: |
          mode="${REQUESTED_MODE:-offline}"
          if [ "$EVENT_NAME" = "schedule" ]; then mode="${SCHEDULED_MODE:-offline}"; fi
          if [ "$mode" = "live" ]; then
            python src/main.py --mode live --task-id "${REQUESTED_TASK:-$CVAT_TASK_ID}" --session "Scheduled mentor report" --llm-summary --notify preview
          else
            python src/main.py --mode offline --snapshot sample_data/powerbi_demo --frame-size 1920x1080 --session "Demo mentor report" --llm-summary --notify preview
          fi
      - name: Upload report, database and CSV bundle
        uses: actions/upload-artifact@v4
        with:
          name: annotation-report-${{ github.run_number }}
          path: |
            data/runs/
            data/processed/
            data/annotation_reporting.db
          if-no-files-found: error
          retention-days: 14
